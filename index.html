<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Library System</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  margin:0;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#263238;
  color:white;
  padding:20px;
  text-align:center;
}

.container{
  width:95%;
  max-width:1200px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.top-bar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

input, select, button{
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:14px;
}

input[type="text"]{
  flex:1;
}

button{
  cursor:pointer;
  border:none;
  background:#2e7d32;
  color:white;
}

button:hover{
  opacity:0.9;
}

.btn-red{
  background:#c62828;
}

.btn-blue{
  background:#1565c0;
}

.btn-orange{
  background:#ef6c00;
}

.admin-box{
  margin-bottom:15px;
  padding:12px;
  background:#eef7ff;
  border-radius:8px;
}

.form-box{
  display:none;
  margin-bottom:20px;
  padding:15px;
  background:#fafafa;
  border:1px solid #ddd;
  border-radius:8px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th, td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
  vertical-align:middle;
}

th{
  background:#37474f;
  color:white;
}

.cover{
  width:60px;
  height:80px;
  object-fit:cover;
  border-radius:4px;
  background:#ddd;
}

.available{
  color:green;
  font-weight:bold;
}

.borrowed{
  color:red;
  font-weight:bold;
}

.qr{
  width:70px;
  height:70px;
}

.action-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  justify-content:center;
}

.hidden{
  display:none;
}

@media(max-width:768px){
  table{
    font-size:12px;
  }

  th, td{
    padding:6px;
  }

  .cover{
    width:45px;
    height:60px;
  }

  .qr{
    width:55px;
    height:55px;
  }
}
</style>
</head>

<body>

<header>
  <h1>📚 Book Library System</h1>
  <p>Online book inventory, borrowing, returning, and QR code system</p>
</header>

<div class="container">

  <div class="admin-box">
    <button onclick="adminLogin()">Admin Login</button>
    <button class="btn-red" onclick="adminLogout()">Logout</button>
    <span id="adminStatus">Status: Guest</span>
  </div>

  <div class="top-bar">
    <input type="text" id="searchInput" placeholder="Search by code, title, author, or category..." onkeyup="searchBooks()">
    <button onclick="showAddForm()">Add Book</button>
  </div>

  <div class="form-box" id="bookFormBox">
    <h3 id="formTitle">Add Book</h3>

    <div class="form-grid">
      <input type="text" id="bookCode" placeholder="Book Code e.g. BK001">
      <input type="text" id="bookTitle" placeholder="Book Title">
      <input type="text" id="bookAuthor" placeholder="Author">
      <input type="text" id="bookCategory" placeholder="Category">
      <input type="file" id="bookCover" accept="image/*">
    </div>

    <br>

    <button onclick="saveBook()">Save Book</button>
    <button class="btn-red" onclick="cancelForm()">Cancel</button>
  </div>

  <h2>Book List</h2>

  <table>
    <thead>
      <tr>
        <th>Cover</th>
        <th>Code</th>
        <th>Title</th>
        <th>Author</th>
        <th>Category</th>
        <th>Status</th>
        <th>Borrower</th>
        <th>QR Code</th>
        <th class="adminOnly">Actions</th>
      </tr>
    </thead>

    <tbody id="bookTable"></tbody>
  </table>

</div>

<script>
let adminPassword = "Admin123";
let isAdmin = false;
let editIndex = null;

let books = JSON.parse(localStorage.getItem("books")) || [
  {
    code:"BK001",
    title:"Energy Management",
    author:"John Smith",
    category:"Energy",
    status:"Available",
    borrower:"",
    cover:""
  },
  {
    code:"BK002",
    title:"Machine Learning for Engineers",
    author:"Tom Brown",
    category:"Engineering",
    status:"Borrowed",
    borrower:"Example User",
    cover:""
  }
];

function saveToStorage(){
  localStorage.setItem("books", JSON.stringify(books));
}

function adminLogin(){
  let password = prompt("Enter admin password:");

  if(password === adminPassword){
    isAdmin = true;
    document.getElementById("adminStatus").innerText = "Status: Admin";
    loadBooks();
    alert("Admin login successful");
  }else{
    alert("Incorrect password");
  }
}

function adminLogout(){
  isAdmin = false;
  document.getElementById("adminStatus").innerText = "Status: Guest";
  document.getElementById("bookFormBox").style.display = "none";
  loadBooks();
}

function showAddForm(){
  if(!isAdmin){
    alert("Admin only");
    return;
  }

  editIndex = null;
  document.getElementById("formTitle").innerText = "Add Book";
  document.getElementById("bookCode").value = "";
  document.getElementById("bookTitle").value = "";
  document.getElementById("bookAuthor").value = "";
  document.getElementById("bookCategory").value = "";
  document.getElementById("bookCover").value = "";
  document.getElementById("bookFormBox").style.display = "block";
}

function cancelForm(){
  document.getElementById("bookFormBox").style.display = "none";
}

function saveBook(){
  if(!isAdmin){
    alert("Admin only");
    return;
  }

  let code = document.getElementById("bookCode").value.trim();
  let title = document.getElementById("bookTitle").value.trim();
  let author = document.getElementById("bookAuthor").value.trim();
  let category = document.getElementById("bookCategory").value.trim();
  let coverFile = document.getElementById("bookCover").files[0];

  if(!code || !title || !author || !category){
    alert("Please fill in all fields");
    return;
  }

  let duplicate = books.some((book, index) => book.code === code && index !== editIndex);

  if(duplicate){
    alert("Book code already exists");
    return;
  }

  if(coverFile){
    let reader = new FileReader();

    reader.onload = function(e){
      saveBookData(code, title, author, category, e.target.result);
    };

    reader.readAsDataURL(coverFile);
  }else{
    let oldCover = editIndex !== null ? books[editIndex].cover : "";
    saveBookData(code, title, author, category, oldCover);
  }
}

function saveBookData(code, title, author, category, cover){
  if(editIndex === null){
    books.push({
      code:code,
      title:title,
      author:author,
      category:category,
      status:"Available",
      borrower:"",
      cover:cover
    });
  }else{
    books[editIndex].code = code;
    books[editIndex].title = title;
    books[editIndex].author = author;
    books[editIndex].category = category;
    books[editIndex].cover = cover;
  }

  saveToStorage();
  loadBooks();
  cancelForm();
  alert("Book saved successfully");
}

function editBook(index){
  if(!isAdmin){
    alert("Admin only");
    return;
  }

  editIndex = index;

  document.getElementById("formTitle").innerText = "Edit Book";
  document.getElementById("bookCode").value = books[index].code;
  document.getElementById("bookTitle").value = books[index].title;
  document.getElementById("bookAuthor").value = books[index].author;
  document.getElementById("bookCategory").value = books[index].category;
  document.getElementById("bookCover").value = "";
  document.getElementById("bookFormBox").style.display = "block";
}

function deleteBook(index){
  if(!isAdmin){
    alert("Admin only");
    return;
  }

  if(confirm("Are you sure you want to delete this book?")){
    books.splice(index,1);
    saveToStorage();
    loadBooks();
  }
}

function borrowBook(index){
  if(!isAdmin){
    alert("Admin only");
    return;
  }

  if(books[index].status === "Borrowed"){
    alert("This book is already borrowed");
    return;
  }

  let borrower = prompt("Enter borrower name:");

  if(borrower){
    books[index].status = "Borrowed";
    books[index].borrower = borrower;
    saveToStorage();
    loadBooks();
  }
}

function returnBook(index){
  if(!isAdmin){
    alert("Admin only");
    return;
  }

  books[index].status = "Available";
  books[index].borrower = "";
  saveToStorage();
  loadBooks();
}

function getQRCode(code){
  let text = window.location.href + "?book=" + encodeURIComponent(code);
  return "https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=" + encodeURIComponent(text);
}

function loadBooks(data = books){
  let table = document.getElementById("bookTable");
  table.innerHTML = "";

  data.forEach((book) => {
    let realIndex = books.findIndex(b => b.code === book.code);

    let statusClass = book.status === "Available" ? "available" : "borrowed";

    let coverImage = book.cover
      ? `<img src="${book.cover}" class="cover">`
      : `<div class="cover"></div>`;

    let actions = "";

    if(isAdmin){
      actions = `
        <div class="action-buttons">
          <button class="btn-blue" onclick="editBook(${realIndex})">Edit</button>
          <button class="btn-red" onclick="deleteBook(${realIndex})">Delete</button>
          <button class="btn-orange" onclick="borrowBook(${realIndex})">Borrow</button>
          <button onclick="returnBook(${realIndex})">Return</button>
        </div>
      `;
    }else{
      actions = `<span>Admin only</span>`;
    }

    table.innerHTML += `
      <tr>
        <td>${coverImage}</td>
        <td>${book.code}</td>
        <td>${book.title}</td>
        <td>${book.author}</td>
        <td>${book.category}</td>
        <td class="${statusClass}">${book.status}</td>
        <td>${book.borrower || "-"}</td>
        <td><img src="${getQRCode(book.code)}" class="qr"></td>
        <td>${actions}</td>
      </tr>
    `;
  });
}

function searchBooks(){
  let keyword = document.getElementById("searchInput").value.toLowerCase();

  let result = books.filter(book =>
    book.code.toLowerCase().includes(keyword) ||
    book.title.toLowerCase().includes(keyword) ||
    book.author.toLowerCase().includes(keyword) ||
    book.category.toLowerCase().includes(keyword)
  );

  loadBooks(result);
}

loadBooks();
</script>

</body>
</html>
